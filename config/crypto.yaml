crypto:
  # The Key Encapsulation Mechanism (KEM) for hybrid key exchange
  kem:
    primary: "ML-KEM-768" # FIPS 203 Kyber
    fallback: "X25519"    # Classical ECDH fallback

  # The Digital Signature Algorithm (DSA) for authentication
  dsa:
    primary: "ML-DSA-65"  # FIPS 204 Dilithium
    fallback: "ECDSA-P256" # Classical signature fallback

  # Crypto-agility: If true, allows switching algorithms on-the-fly via reloading
  agile_mode: true

proxy:
  # Client-side Proxy (Listens to internal network FIX engine)
  client_proxy:
    host: "127.0.0.1"
    port: 5001

  # Server-side Proxy (Listens to internet for PQC Tunnel)
  server_proxy:
    host: "127.0.0.1"
    port: 5002

  # The actual FIX Destination (e.g., BIST Server)
  target_fix_server:
    host: "127.0.0.1"
    port: 5003

  # High-Frequency Trading (HFT) Tuning
  hft_tuning:
    socket_nodelay: true # Disable Nagle's algorithm for low latency
    recv_buffer_size: 65536
    send_buffer_size: 65536
