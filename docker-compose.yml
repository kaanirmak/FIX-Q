version: '3.8'

services:
  # ─────────────────────────────────────────────────────────
  # 1. FINORA-Q Core Framework, Gateway & Test Engine
  # ─────────────────────────────────────────────────────────
  finora-q:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finora-q-core
    restart: unless-stopped
    ports:
      - "8080:8080"   # Web UI Terminal
      - "9100:9100"   # Test Engine API & Prometheus Metrics
      - "5003:5003"   # Mock BIST Matching Engine
      - "5006:5006"   # PQC Gateway (FIPS 203 & 204)
      - "5007:5007"   # Classical TLS 1.3 Proxy
      - "5011:5011"   # Borsa Classical FIX Gateway
      - "5012:5012"   # Banking Classical ISO 20022 Gateway
      - "5013:5013"   # Web3 Classical RPC Gateway
      - "5021:5021"   # Borsa Quantum PQC Gateway
      - "5022:5022"   # Banking Quantum PQC Gateway
      - "5023:5023"   # Web3 Quantum PQC Gateway
    volumes:
      - ./logs:/app/logs
    networks:
      - finora-network

  # ─────────────────────────────────────────────────────────
  # 2. Prometheus Time-Series Server
  # ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: finora-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - finora-q
    networks:
      - finora-network

  # ─────────────────────────────────────────────────────────
  # 3. Grafana Visualization Dashboards
  # ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:latest
    container_name: finora-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./monitoring/provisioning/datasources/prometheus.docker.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/provisioning/dashboards/dashboards.docker.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - finora-network

networks:
  finora-network:
    driver: bridge
